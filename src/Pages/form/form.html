<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" type="text/css" href=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jomhuria&display=swap" rel="stylesheet">
    
</head>
<body>
    <div>
    <div class="form-container">
        <h2 id="titulo-registro" >Registro de Usuario</h2>
        <form action="/..." method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="ingrese su nombre">

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required placeholder="ingrese su apellido">

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{10}" placeholder="ingrese su numero telefono">
    
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="ingrese su correo electronico">
    
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required placeholder="ingrese su contraseña">

            <label for="confirmar-contraseña">Confirmar Contraseña:</label>
            <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" required placeholder="confirme su contraseña">
    
        <input type="submit" value="Registrarse">
        </form>


        <button class="close-button" onclick="cerrarVentana()">X</button>

    </div>

</div>

<script>

    function cerrarVentana() {
        window.close(); 
    }
</script>


</body>
</html>
